<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" role="img" aria-labelledby="title desc">
  <title id="title">The deployed actor and the training-only critic</title>
  <desc id="desc">During play, commands and proprioception enter the actor, which sends ten joint targets to the robot. During training, replay and privileged simulator measurements help the critic improve the actor.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#28665f"/></marker>
  </defs>
  <rect width="960" height="375" rx="18" fill="#f4f5ed"/>
  <g font-family="sans-serif" fill="#173f3a">
    <text x="25" y="31" font-size="20" font-weight="bold">During play: one learned feedback loop</text>
    <g fill="#e0ece4" stroke="#74a895" stroke-width="2">
      <rect x="25" y="70" width="170" height="76" rx="12"/>
      <rect x="305" y="70" width="200" height="76" rx="12"/>
      <rect x="665" y="70" width="270" height="76" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="19" font-weight="bold">
      <text x="110" y="101">Your commands</text>
      <text x="405" y="101">Actor</text>
      <text x="800" y="101">Robot + physics</text>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="110" y="125">forward / back / turn</text>
      <text x="405" y="125">small neural network</text>
      <text x="800" y="125">motors, gravity, contacts</text>
    </g>
    <g stroke="#28665f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M195 108 H297"/>
      <path d="M505 108 H657"/>
      <path d="M800 147 V205 H405 V154"/>
    </g>
    <text x="530" y="94" font-size="15">10 joint targets</text>
    <text x="470" y="192" font-size="16">IMU + joints + previous actions</text>
    <path d="M25 235 H935" stroke="#c9d4c8"/>
    <text x="25" y="265" font-size="20" font-weight="bold">During learning only</text>
    <g fill="#f5e7c6" stroke="#c3a66c" stroke-width="2">
      <rect x="25" y="285" width="170" height="66" rx="12"/>
      <rect x="305" y="285" width="280" height="66" rx="12"/>
      <rect x="715" y="285" width="220" height="66" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="18" font-weight="bold">
      <text x="110" y="313">Replay</text>
      <text x="445" y="313">Critic</text>
      <text x="825" y="313">Improve the actor</text>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="110" y="335">saved experience</text>
      <text x="445" y="335">extra simulator information allowed</text>
      <text x="825" y="335">update network weights</text>
    </g>
    <g stroke="#28665f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M195 318 H297"/>
      <path d="M585 318 H707"/>
    </g>
  </g>
</svg>
