<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647a76"/></marker></defs><rect width="1200" height="620" rx="20" fill="#faf7f0"/><text x="45" y="52" font-family="sans-serif" font-size="29" font-weight="bold" fill="#263b3b">One control step</text><text x="45" y="88" font-family="sans-serif" font-size="18" fill="#516766">The actor uses proprioception and a movement command.</text><path d="M335,230 H420" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="370" y="215" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766"></text><path d="M715,230 H800" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="145" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">joint targets</text><path d="M980,295 V335 H190 V300" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="328" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">next observation</text><path d="M980,335 V437 H720" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="370" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">simulator measurements</text><rect x="45" y="165" width="290" height="130" rx="14" fill="#25847a"/><text x="190.0" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Observation</text><text x="190.0" y="233" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">IMU · joints · previous action</text><text x="190.0" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Requested speed and yaw</text><rect x="425" y="165" width="290" height="130" rx="14" fill="#6376ad"/><text x="570.0" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Actor policy</text><text x="570.0" y="233" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Neural network</text><text x="570.0" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Ten leg-joint actions</text><rect x="805" y="165" width="350" height="130" rx="14" fill="#b7732e"/><text x="980.0" y="200" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Robot + physics</text><text x="980.0" y="233" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Joint position controllers</text><text x="980.0" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Motion and contacts</text><rect x="425" y="375" width="290" height="125" rx="14" fill="#526762"/><text x="570.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Training only</text><text x="570.0" y="443" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Reward + privileged critic</text><text x="570.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Evaluate action quality</text><text x="45" y="555" font-family="sans-serif" font-size="17" fill="#516766">No true base velocity, world position, absolute heading, or terrain map enters the actor.</text><text x="45" y="583" font-family="sans-serif" font-size="17" fill="#516766">The critic helps learning; only the actor controls the deployed robot.</text></svg>