<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#647a76"/></marker></defs><rect width="1200" height="620" rx="20" fill="#faf7f0"/><text x="45" y="52" font-family="sans-serif" font-size="29" font-weight="bold" fill="#263b3b">Soft Actor-Critic</text><text x="45" y="88" font-family="sans-serif" font-size="18" fill="#516766">Reuse collected experience; improve the actor and critics repeatedly.</text><path d="M325,220 H435" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="205" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">store</text><path d="M720,220 H830" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="778" y="205" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">sample</text><path d="M995,285 V437 H725" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="342" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">critic estimates</text><path d="M440,437 H185 V290" fill="none" stroke="#647a76" stroke-width="3" marker-end="url(#arrow)"/><text x="255" y="418" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#516766">updated policy</text><rect x="45" y="155" width="280" height="130" rx="14" fill="#25847a"/><text x="185.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Collect experience</text><text x="185.0" y="223" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Observe → act → step</text><text x="185.0" y="248" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Store reward and next state</text><rect x="440" y="155" width="280" height="130" rx="14" fill="#b7732e"/><text x="580.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Replay buffer</text><text x="580.0" y="223" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Many previous transitions</text><text x="580.0" y="248" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Sample a learning batch</text><rect x="835" y="155" width="320" height="130" rx="14" fill="#6376ad"/><text x="995.0" y="190" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Two critics</text><text x="995.0" y="223" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Predict future return</text><text x="995.0" y="248" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Use the smaller estimate</text><rect x="440" y="375" width="280" height="125" rx="14" fill="#526762"/><text x="580.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">Actor update</text><text x="580.0" y="443" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Favor useful actions</text><text x="580.0" y="468" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">Entropy supports exploration</text><text x="45" y="555" font-family="sans-serif" font-size="17" fill="#516766">Parallel robots collect transitions. Replay batches drive separate neural-network updates.</text><text x="45" y="583" font-family="sans-serif" font-size="17" fill="#516766">Training samples actions; evaluation uses deterministic policy actions.</text></svg>